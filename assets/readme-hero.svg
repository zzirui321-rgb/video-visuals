    <text x="48" y="160" fill="#f4f7ff" font-size="76" font-weight="700" letter-spacing="-4">video</text>
    <text x="48" y="239" fill="url(#accent)" font-size="76" font-weight="700" letter-spacing="-4">visuals.</text>
    <text x="54" y="292" fill="#d6dfed" font-size="22" font-family="Microsoft YaHei,Arial,sans-serif">从一句话，到一套视频视觉资产。</text>
    <text x="54" y="328" fill="#8999b4" font-size="14">Covers. Chapters. Sourced B-roll. Editable motion.</text>
