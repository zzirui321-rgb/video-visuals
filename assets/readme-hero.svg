<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">video-visuals — 从一句话，到一套视频视觉资产</title>
  <desc id="desc">深色网格背景，青绿项目标题，以及封面、章节卡、B-roll 三种资产的抽象图形。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1325"/><stop offset="1" stop-color="#15132b"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#8bf5d0"/><stop offset="1" stop-color="#72baff"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#b5c6e5" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="1200" height="440" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="440" rx="24" fill="url(#grid)"/>
  <g font-family="Segoe UI,Arial,sans-serif">
